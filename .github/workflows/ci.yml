name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships a full Android SDK (ANDROID_HOME), so no
      # extra SDK-setup action is needed - android-actions/setup-android@v3
      # was failing outright trying to install the long-removed 'tools'
      # package.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and lint
        run: ./gradlew build --console=plain
